<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152438"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3"/>
      <stop offset="100%" stop-color="#2ec782"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cd7f6"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4edea3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Escudo Base de Segurança -->
  <path d="M32 4 C46 9 55 13 55 24 C55 42 42 53 32 60 C22 53 9 42 9 24 C9 13 18 9 32 4 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#neonGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Detalhe superior em ciano -->
  <path d="M22 17 C26 15 30 14 32 13 C34 14 38 15 42 17" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.85"/>

  <!-- Checkmark Oficial com corte angular moderno -->
  <path d="M20 32 L28 40 L45 22" 
        fill="none" 
        stroke="url(#neonGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
